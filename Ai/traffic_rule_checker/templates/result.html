<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Rule Results</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9fafc; padding: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; max-width: 500px; margin: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        h2 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f6f9; margin: 5px 0; padding: 10px; border-left: 5px solid #007bff; border-radius: 5px; }
        .ok { border-left-color: green; color: green; font-weight: bold; }
        a { display: block; margin-top: 20px; text-align: center; text-decoration: none; background: #007bff; color: #fff; padding: 10px; border-radius: 5px; }
        a:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚗 Results for Driver: {{ driver }}</h2>
        <ul>
            {% for v in violations %}
                <li class="{% if v == 'No Violations ✅' %}ok{% endif %}">{{ v }}</li>
            {% endfor %}
        </ul>
        <a href="/">⬅ Check Another Driver</a>
    </div>
</body>
</html>
