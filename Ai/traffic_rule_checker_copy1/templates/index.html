<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Rules Violation Checker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-header i {
            font-size: 1.5em;
            margin-right: 10px;
            color: #667eea;
        }

        .card-header h3 {
            color: #333;
            font-size: 1.4em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: end;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9ff;
            padding: 10px;
            border-radius: 8px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4b1f, #ff9068);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quick-actions {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card i {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stat-card h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .mode-toggle {
            display: flex;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .mode-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .mode-toggle button.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .button-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-traffic-light"></i> Traffic Rules Violation Checker</h1>
            <p>Smart AI-powered traffic violation detection system</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <i class="fas fa-users" style="color: #667eea;"></i>
                <h4>Total Drivers</h4>
                <p id="total-drivers">-</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-exclamation-triangle" style="color: #ff4b1f;"></i>
                <h4>Active Violations</h4>
                <p id="total-violations">-</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt" style="color: #56ab2f;"></i>
                <h4>Safe Drivers</h4>
                <p id="safe-drivers">-</p>
            </div>
        </div>

        <form method="POST" id="main-form">
            <div class="main-content">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-user-check"></i>
                        <h3>Driver Information</h3>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Driver Name</label>
                            <input type="text" name="driver" placeholder="Enter driver name" required>
                        </div>
                        <div class="form-group">
                            <label>Junction</label>
                            <input type="text" name="junction" placeholder="Enter junction ID" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Helmet Status</label>
                            <select name="helmet">
                                <option value="yes">✅ Wearing Helmet</option>
                                <option value="no" selected>❌ No Helmet</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Signal Color</label>
                            <select name="signal">
                                <option value="red" selected>🔴 Red</option>
                                <option value="green">🟢 Green</option>
                                <option value="yellow">🟡 Yellow</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Stopped at Signal</label>
                            <select name="stopped">
                                <option value="yes">✅ Stopped</option>
                                <option value="no" selected>❌ Did not stop</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Current Speed (km/h)</label>
                            <input type="number" name="speed" value="50" min="0" max="200">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Speed Limit (km/h)</label>
                        <input type="number" name="speed_limit" value="40" min="0" max="120">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" name="persist" value="yes" checked>
                        <label>Save data for future analysis</label>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-search"></i>
                        <h3>Analysis Options</h3>
                    </div>

                    <div class="mode-toggle">
                        <button type="button" class="active" onclick="switchMode('by_driver')">By Driver</button>
                        <button type="button" onclick="switchMode('by_violation')">By Violation</button>
                    </div>
                    <input type="hidden" name="mode" value="by_driver">

                    <div class="form-group" id="violation-input" style="display: none;">
                        <label>Violation Type</label>
                        <select name="violation_label">
                            <option value="Helmet Rule Violation">Helmet Rule Violation</option>
                            <option value="Signal Rule Violation">Signal Rule Violation</option>
                            <option value="Speed Limit Violation">Speed Limit Violation</option>
                        </select>
                    </div>

                    <div class="button-grid">
                        <button type="submit" name="action" value="check" class="btn btn-primary">
                            <i class="fas fa-search"></i> Check Violations
                        </button>
                        <button type="submit" name="action" value="first_violation" class="btn btn-info">
                            <i class="fas fa-eye"></i> First Violation
                        </button>
                        <button type="submit" name="action" value="check_safe" class="btn btn-success">
                            <i class="fas fa-shield-alt"></i> Safety Check
                        </button>
                        <button type="submit" name="action" value="calc_fine" class="btn btn-warning">
                            <i class="fas fa-calculator"></i> Calculate Fine
                        </button>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <div class="card-header">
                    <i class="fas fa-bolt"></i>
                    <h3>Quick Actions</h3>
                </div>
                <div class="button-grid">
                    <button type="submit" name="action" value="list_all_drivers" class="btn btn-info">
                        <i class="fas fa-list"></i> List All Drivers
                    </button>
                    <button type="submit" name="action" value="list_violators" class="btn btn-warning">
                        <i class="fas fa-exclamation-circle"></i> List Violators
                    </button>
                    <button type="submit" name="action" value="remove_driver" class="btn btn-danger">
                        <i class="fas fa-user-minus"></i> Remove Driver
                    </button>
                    <button type="submit" name="action" value="reset_facts" class="btn btn-danger">
                        <i class="fas fa-trash-alt"></i> Reset All Data
                    </button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your request...</p>
            </div>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            document.querySelector('input[name="mode"]').value = mode;
            document.querySelectorAll('.mode-toggle button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const violationInput = document.getElementById('violation-input');
            if (mode === 'by_violation') {
                violationInput.style.display = 'block';
            } else {
                violationInput.style.display = 'none';
            }
        }

        document.getElementById('main-form').addEventListener('submit', function() {
            document.getElementById('loading').style.display = 'block';
        });

        // Load stats on page load
        window.addEventListener('load', function() {
            loadStats();
        });

        function loadStats() {
            // This would typically fetch from an API endpoint
            document.getElementById('total-drivers').textContent = '---';
            document.getElementById('total-violations').textContent = '---';
            document.getElementById('safe-drivers').textContent = '---';
        }
    </script>
</body>
</html>
