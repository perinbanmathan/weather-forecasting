<!DOCTYPE html>
<html>
<head>

  <style>
    body { background:#f5f7fa; padding:40px; }
    .result-box {
      background:#fff;
      border-radius:10px;
      padding:25px;
      box-shadow:0 6px 16px rgba(0,0,0,0.08);

<body>

  <h3>⚙️ Optimization Results</h3>

  <div class="result-box">

      <h5 class="section-title">🔷 A* Optimized Plan</h5>

      <ul>
       
        <li><strong>Speed Limit Violation</strong>: ₹1,000</li>

      </ul>

        <strong>Penalty after A* optimization:</strong>
