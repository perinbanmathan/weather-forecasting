<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Rule Violation Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; font-family: Arial, sans-serif; }
    .container { margin-top: 40px; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #333; font-weight: 600; }
    .form-section { margin-bottom: 20px; }
    label { font-weight: 500; }
    .btn-custom { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h1 class="mb-4 text-center">🚦 Traffic Rule Violation Checker</h1>

      <form method="POST">
        <!-- Mode Selection -->
        <div class="form-section">
          <label for="mode" class="form-label">Mode</label>
          <select class="form-select" name="mode" id="mode">
            <option value="by_driver">By Driver</option>
            <option value="by_violation">By Violation</option>
          </select>
        </div>

        <!-- Driver & Junction Details -->
        <div class="form-section row">
          <div class="col-md-6">
            <label class="form-label">Driver Name</label>
            <input type="text" class="form-control" name="driver" placeholder="Enter driver name">
          </div>
          <div class="col-md-6">
            <label class="form-label">Junction Name</label>
            <input type="text" class="form-control" name="junction" placeholder="Enter junction">
          </div>
        </div>

        <!-- Traffic Details -->
        <div class="form-section row">
          <div class="col-md-4">
            <label class="form-label">Helmet</label>
            <select class="form-select" name="helmet">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Signal</label>
            <select class="form-select" name="signal">
              <option value="red">Red</option>
              <option value="green">Green</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stopped at Signal?</label>
            <select class="form-select" name="stopped">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
        </div>

        <!-- Speed Details -->
        <div class="form-section row">
          <div class="col-md-6">
            <label class="form-label">Driver Speed</label>
            <input type="number" class="form-control" name="speed" placeholder="e.g., 70">
          </div>
          <div class="col-md-6">
            <label class="form-label">Speed Limit</label>
            <input type="number" class="form-control" name="speed_limit" placeholder="e.g., 60">
          </div>
        </div>

        <!-- Persist Choice -->
        <div class="form-section">
          <label class="form-label">Persistence</label>
          <select class="form-select" name="persist">
            <option value="yes">Add (Keep History)</option>
            <option value="overwrite">Overwrite</option>
          </select>
        </div>

        <!-- Actions -->
        <div class="form-section">
          <label class="form-label">Action</label>
          <select class="form-select" name="action">
            <option value="">Check Violations</option>
            <option value="list_all_drivers">List All Drivers</option>
            <option value="list_violators">List Violators</option>
            <option value="reset_facts">Reset All Facts</option>
            <option value="remove_driver">Remove Driver</option>
            <option value="check_safe">Check if Safe</option>
            <option value="calc_fine">Calculate Fine</option>
          </select>
        </div>

        <!-- For By Violation Mode -->
        <div class="form-section">
          <label class="form-label">Violation Type (for By Violation)</label>
          <select class="form-select" name="violation_label">
            <option value="Helmet Rule Violation">Helmet Rule Violation</option>
            <option value="Signal Rule Violation">Signal Rule Violation</option>
            <option value="Speed Limit Violation">Speed Limit Violation</option>
          </select>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-lg btn-custom mt-3">Submit</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
