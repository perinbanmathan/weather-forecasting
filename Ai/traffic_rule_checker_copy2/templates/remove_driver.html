{% extends "base.html" %}
{% block title %}Remove Driver{% endblock %}
{% block content %}
<div class="card p-4">
  <h4 class="mb-3">Remove Driver Facts</h4>
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Driver Name</label>
        <input name="driver" class="form-control" placeholder="e.g., Arjun">
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-danger">Remove</button>
    </div>
  </form>
</div>
{% endblock %}
