{% extends "base.html" %}
{% block title %}Driver Result{% endblock %}
{% block content %}
<div class="card p-4">
  <h5 class="mb-2">Driver: <b>{{ driver }}</b></h5>
  {% if info %}
    <ul class="mb-3">
      {% for i in info %}<li class="text-muted">{{ i }}</li>{% endfor %}
    </ul>
  {% endif %}
  <h6 class="mb-2">Violations</h6>
  <ul class="list-group">
    {% for v in violations %}
      <li class="list-group-item {{ 'text-success' if 'No Violation' in v or 'Safe' in v else 'text-danger' }}">{{ v }}</li>
    {% endfor %}
  </ul>
  <a href="/by-driver" class="btn btn-link mt-3">← Back</a>
</div>
{% endblock %}
