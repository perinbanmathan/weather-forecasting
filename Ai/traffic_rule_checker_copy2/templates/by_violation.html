{% extends "base.html" %}
{% block title %}By Violation{% endblock %}
{% block content %}
<div class="card p-4">
  <h4 class="mb-3">Drivers by Violation Type</h4>
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Violation Type</label>
        <select class="form-select" name="violation_label">
          <option>Helmet Rule Violation</option>
          <option>Signal Rule Violation</option>
          <option>Speed Limit Violation</option>
        </select>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary">Search</button>
    </div>
  </form>
</div>
{% endblock %}
