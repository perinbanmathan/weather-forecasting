<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Traffic Checker{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9; }
    .navbar { border-bottom:1px solid rgba(0,0,0,.08); }
    .card { border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,.08); }
    .container-narrow{ max-width:980px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">🚦 Traffic Checker</a>
    <div class="collapse navbar-collapse show">
      <ul class="navbar-nav ms-auto gap-2">
        <li class="nav-item"><a class="nav-link" href="/by-driver">By Driver</a></li>
        <li class="nav-item"><a class="nav-link" href="/by-violation">By Violation</a></li>
        <li class="nav-item"><a class="nav-link" href="/drivers">All Drivers</a></li>
        <li class="nav-item"><a class="nav-link" href="/violators">Violators</a></li>
        <li class="nav-item"><a class="nav-link" href="/safe-check">Safe Check</a></li>
        <li class="nav-item"><a class="nav-link" href="/calc-fine">Calculate Fine</a></li>
      </ul>
      <form class="ms-3" action="/reset" method="post">
        <button class="btn btn-outline-danger btn-sm" type="submit">Reset All</button>
      </form>
    </div>
  </div>
</nav>

<main class="container container-narrow my-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
