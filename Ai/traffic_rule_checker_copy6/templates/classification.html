<!DOCTYPE html>
<html>
<head>
    <title>Traffic Rule Classification</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">🚦 Traffic Rule Violation – ML Classification</h2>

    <div class="card shadow p-4">

        <form id="classifyForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Driver Name</label>
                    <input class="form-control" name="driver" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Junction</label>
                    <input class="form-control" name="junction" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Helmet</label>
                    <select name="helmet" class="form-control">
                        <option>yes</option>
                        <option>no</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Signal</label>
                    <select name="signal" class="form-control">
                        <option>red</option>
                        <option>green</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Stopped at Junction?</label>
                    <select name="stopped" class="form-control">
                        <option>yes</option>
                        <option>no</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Speed (km/h)</label>
                    <input type="number" class="form-control" name="speed" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Speed Limit (km/h)</label>
                    <input type="number" class="form-control" name="speed_limit" required>
                </div>

            </div>

            <button class="btn btn-success w-100">🔍 Classify</button>
        </form>
    </div>

    <div id="resultSection" class="mt-4" style="display:none;">
        <h4 class="text-center">📊 Classification Result</h4>

        <div class="card shadow p-4">

            <h5>Prolog Reasoning:</h5>
            <div id="prologResult" class="alert alert-info"></div>

            <hr>

            <h5>ML Predictions:</h5>
            <ul class="list-group" id="mlResults"></ul>
        </div>
    </div>

</div>

<script>
document.getElementById("classifyForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/classify", {
        method: "POST",
        body: formData
    });

    const result = await response.json();

    document.getElementById("prologResult").innerHTML = result.prolog_reasoning;

    // clear previous ML results
    let list = document.getElementById("mlResults");
    list.innerHTML = "";

    for (let model in result.ml_predictions){
        let item = document.createElement("li");
        item.className = "list-group-item d-flex justify-content-between";
        item.innerHTML = `<strong>${model}</strong> <span>${result.ml_predictions[model]}</span>`;
        list.appendChild(item);
    }

    document.getElementById("resultSection").style.display = "block";
});
</script>

</body>
</html>
