<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Traffic Violation Expert System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🚦 Traffic Violation Expert System</h1>
    <nav><a href="{{ url_for('index') }}">Home</a></nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<div>{{ m }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <small>Built with Flask + SWI-Prolog (PySWIP)</small>
  </footer>
</body>
</html>
