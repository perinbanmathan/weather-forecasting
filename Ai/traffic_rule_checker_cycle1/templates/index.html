<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Rule Violation Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h1 class="text-center text-danger">🚦 Traffic Rule Violation Checker</h1>
      <p class="text-center text-muted">Check violations of a driver using A* and AO* ranking</p>
      <form action="/check" method="POST" class="mt-4">
        <div class="mb-3">
          <label for="driver" class="form-label">Enter Driver Name</label>
          <input type="text" id="driver" name="driver" class="form-control" placeholder="e.g. Mathan" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Check Violations</button>
      </form>
    </div>
  </div>
</body>
</html>
