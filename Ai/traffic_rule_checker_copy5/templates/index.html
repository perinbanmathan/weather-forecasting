<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Traffic Rules Violation Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --accent: #0d6efd; }
    body { font-family: Inter, system-ui, Arial, sans-serif; background:#f4f7fb; color:#222; margin:0; padding:0; }
    header { background: linear-gradient(90deg,var(--accent), #0b5ed7); color:#fff; padding:18px 12px; }
    .container { max-width:1100px; margin:20px auto; padding:12px; }
    form.card { padding:18px; border-radius:12px; box-shadow:0 6px 18px rgba(13,110,253,0.06); }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; align-items:center; }
    .full { grid-column: 1 / -1; }
    label { font-weight:600; font-size:0.95rem; }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-start; }
    .compact { padding:8px 10px; font-size:0.9rem; border-radius:8px; }
    .charts { margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .chart-card { padding:12px; border-radius:10px; background:#fff; box-shadow:0 3px 10px rgba(0,0,0,0.04); }
    footer { text-align:center; margin:22px 0 40px 0; color:#666; font-size:0.9rem; }
    @media (max-width:800px){ .form-grid{grid-template-columns:1fr;} .charts{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header>
    <div class="container d-flex align-items-center justify-content-between">
      <div><h4 class="mb-0">🚦 Traffic Rules Violation Checker</h4></div>
      <div style="font-size:0.9rem;opacity:0.95"></div>
    </div>
  </header>

  <main class="container">
    <form method="POST" class="card">
      <div class="form-grid">
        <div>
          <label>Driver Name</label>
          <input class="form-control" name="driver" placeholder="e.g., Mathan" />
        </div>

        <div>
          <label>Junction Name</label>
          <input class="form-control" name="junction" placeholder="e.g., junction_1" />
        </div>

        <div>
          <label>Helmet</label>
          <select class="form-select" name="helmet">
            <option value="yes">Yes</option>
            <option value="no" selected>No</option>
          </select>
        </div>

        <div>
          <label>Signal Color</label>
          <select class="form-select" name="signal">
            <option value="green">Green</option>
            <option value="red" selected>Red</option>
          </select>
        </div>

        <div>
          <label>Stopped at Signal</label>
          <select class="form-select" name="stopped">
            <option value="yes">Yes</option>
            <option value="no" selected>No</option>
          </select>
        </div>

        <div>
          <label>Persist Facts?</label>
          <select class="form-select" name="persist">
            <option value="yes" selected>Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <div>
          <label>Speed (km/h)</label>
          <input type="number" class="form-control" name="speed" value="0" />
        </div>

        <div>
          <label>Speed Limit (km/h)</label>
          <input type="number" class="form-control" name="speed_limit" value="0" />
        </div>

        <div class="full">
          <label>Mode</label>
          <select class="form-select" name="mode">
            <option value="by_driver" selected>By Driver</option>
            <option value="by_violation">By Violation</option>
          </select>
        </div>

        <div>
          <label>Violation Label (for By Violation)</label>
          <input class="form-control" name="violation_label" placeholder="Helmet Rule Violation" />
        </div>

        <div class="full">
          <div class="btn-row mt-2">
            <!-- core actions -->
            <button class="btn btn-primary compact" type="submit" name="action" value="check">Check Violations</button>
            <button class="btn btn-outline-primary compact" type="submit" name="action" value="first_violation">First Violation (Cut)</button>
            <button class="btn btn-outline-secondary compact" type="submit" name="action" value="list_all_drivers">List All Drivers</button>
            <button class="btn btn-outline-secondary compact" type="submit" name="action" value="list_violators">List Violators</button>
            <button class="btn btn-outline-success compact" type="submit" name="action" value="calc_fine">Calculate Fine</button>
            <button class="btn btn-outline-warning compact" type="submit" name="action" value="check_safe">Check Safe Driver</button>
            <button class="btn btn-danger compact" type="submit" name="action" value="reset_facts">Reset Facts</button>
            <button class="btn btn-outline-danger compact" type="submit" name="action" value="remove_driver">Remove Driver</button>
          </div>
          <a href="/classification_ui" class="btn btn-primary" style="margin-top:15px;">
    ⚡ ML Classification (Prolog vs ML)
</a>


          <div class="btn-row mt-2">
            <!-- AI features -->
            <button class="btn btn-info compact" type="submit" name="action" value="a_star">🔍 A* — Major Violation</button>
            <button class="btn btn-info compact" type="submit" name="action" value="ao_star">⚖ AO* — Optimize / Combine</button>

            <!-- ML classify posts to /classify and returns JSON (Option A) -->
            <button class="btn btn-dark compact" formaction="/classify" formmethod="POST">
              🤖 ML Classify (JSON)
            </button>
          </div>
        </div>
      </div>
    </form>

    <!-- placeholder for charts (rendered on result page) -->
    <footer>Built with Prolog (PySWIP) · Integrated A* & AO* · ML Classification (sklearn)</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
